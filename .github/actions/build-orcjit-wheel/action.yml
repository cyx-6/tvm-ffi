name: Build OrcJIT Wheel
description: >
  Build and test OrcJIT wheels for a given OS/architecture combination.
  Handles LLVM caching, conda installation, and cibuildwheel execution.

inputs:
  arch:
    description: "Target architecture (e.g., x86_64, aarch64, arm64, AMD64)"
    required: true
  build:
    description: "cibuildwheel build selector (e.g., cp312-manylinux_x86_64)"
    required: true
  checkout_ref:
    description: "Branch, tag, or SHA to check out before building"
    required: true
  llvm_version:
    description: "LLVM version (selects the release tag / conda pin)"
    default: "22.1.0"
    required: false
  llvm_release_repo:
    description: >
      GitHub repo hosting the prebuilt LLVM release assets (Linux only). The
      asset llvm-<version>-linux-<arch>.tar.zst is downloaded from the
      llvm-<version> tag. Point at a fork to validate before the canonical repo.
    default: "mlc-ai/package"
    required: false

runs:
  using: "composite"
  steps:
    - name: Check out source
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.checkout_ref }}
        submodules: recursive

    - uses: ./.github/actions/detect-env-vars
      id: env_vars

    # ---- Acquire LLVM prefix ----
    # Linux: downloaded as a prebuilt tarball from a GitHub Release (built from
    #   source with the manylinux gcc-toolset so the ABI stays under the floor)
    #   and extracted to /opt/llvm. Permanent storage -- no actions/cache lifetime.
    # macOS/Windows: no GLIBCXX floor -- keep the conda-forge binaries, cached.
    - name: Cache LLVM (macOS/Windows)
      if: runner.os != 'Linux'
      uses: actions/cache@v4
      id: llvm-cache
      with:
        path: ${{ runner.os == 'Windows' && 'C:/opt/llvm' || '/opt/llvm' }}
        key: llvm-${{ inputs.llvm_version }}-${{ runner.os }}-${{ inputs.arch }}-v4

    - name: Download prebuilt LLVM (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        asset="llvm-${{ inputs.llvm_version }}-linux-${{ inputs.arch }}.tar.zst"
        base="https://github.com/${{ inputs.llvm_release_repo }}/releases/download"
        url="${base}/llvm-${{ inputs.llvm_version }}/${asset}"
        echo "Downloading $url"
        curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$asset" "$url"
        sudo mkdir -p /opt/llvm
        sudo tar --zstd -xf "$RUNNER_TEMP/$asset" -C /opt/llvm
        sudo chown -R "$(id -u):$(id -g)" /opt/llvm

    - name: Verify LLVM prefix (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        test -x /opt/llvm/bin/llvm-config \
          || { echo "::error::LLVM prefix missing; the release download must succeed first"; exit 1; }
        /opt/llvm/bin/llvm-config --version

    # ---- Install LLVM via conda (macOS/Windows, cache miss only) ----
    - name: Setup conda
      if: steps.llvm-cache.outputs.cache-hit != 'true' && runner.os != 'Linux'
      uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167  # v3.3.0
      continue-on-error: true
      id: conda1
      with:
        miniforge-version: latest

    - name: Setup conda (retry with tar.bz2)
      if: steps.llvm-cache.outputs.cache-hit != 'true' && runner.os != 'Linux' && steps.conda1.outcome == 'failure'
      uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167  # v3.3.0
      with:
        miniforge-version: latest
        use-only-tar-bz2: true

    - name: Create /opt/llvm (macOS)
      if: steps.llvm-cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      run: sudo mkdir -p /opt/llvm && sudo chown -R $(whoami) /opt/llvm

    - name: Install LLVM (macOS)
      if: steps.llvm-cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash -l {0}
      run: |
        conda create -q -p /opt/llvm -c conda-forge \
          llvmdev=${{ inputs.llvm_version }} clangdev=${{ inputs.llvm_version }} \
          compiler-rt=${{ inputs.llvm_version }} zlib zstd-static \
          -y

    - name: Install LLVM (Windows)
      if: steps.llvm-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: cmd /C call {0}
      run: |
        conda create -q -p C:\opt\llvm -c conda-forge llvmdev=${{ inputs.llvm_version }} zlib zstd-static -y

    # ---- Build and test wheels ----
    - name: Build and test wheels
      uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55  # v4.1.0
      with:
        package-dir: addons/tvm_ffi_orcjit
        output-dir: wheelhouse
      env:
        CIBW_BUILD: ${{ inputs.build }}
        CIBW_ARCHS_LINUX: ${{ inputs.arch }}
        CIBW_ARCHS_MACOS: ${{ inputs.arch }}
        CIBW_ARCHS_WINDOWS: ${{ inputs.arch }}
        # Link inside manylinux_2_28 -- the same image family the downloaded LLVM
        # was built in (gcc-toolset-14). An older image couldn't consume its libs.
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
        CIBW_BUILD_VERBOSITY: 1
        CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.env_vars.outputs.cpu_count }}
        CIBW_ENVIRONMENT: LLVM_PREFIX=/opt/llvm
        CIBW_ENVIRONMENT_WINDOWS: LLVM_PREFIX="C:/opt/llvm"
        CIBW_CONTAINER_ENGINE: "docker; create_args: --volume /opt/llvm:/opt/llvm"
        # Build against the in-tree core (not PyPI) so the addon's tvm_ffi ABI
        # matches the core the tests reinstall; a mismatch segfaults the JIT.
        CIBW_BEFORE_BUILD: pip install "scikit-build-core>=0.10.0" cmake ninja "{project}"
        CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
        CIBW_TEST_REQUIRES: pytest pytest-xdist ninja
        CIBW_TEST_COMMAND: >-
          pip install --force-reinstall {project} &&
          pytest {project}/addons/tvm_ffi_orcjit/tests -v &&
          python {project}/addons/tvm_ffi_orcjit/examples/quick-start/run.py --lang cpp &&
          python {project}/addons/tvm_ffi_orcjit/examples/quick-start/run.py --lang c
        CIBW_TEST_COMMAND_WINDOWS: >-
          pip install --force-reinstall {project} &&
          pytest {project}/addons/tvm_ffi_orcjit/tests -v &&
          python {project}/addons/tvm_ffi_orcjit/examples/quick-start/run.py --lang c

    # ---- ABI floor assertion (Linux) ----
    # libstdc++ is linked dynamically, so the wheel's manylinux tag is now a real
    # signal about the LLVM prefix's ABI. Assert it explicitly: auditwheel does NOT
    # fail on a too-new symbol, it silently picks a laxer tag (e.g. GLIBCXX_3.4.30
    # would still produce a valid manylinux_2_35 wheel), which would let an ABI
    # regression in the prebuilt LLVM pass CI unnoticed.
    - name: Assert manylinux ABI floor (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        wheels=(wheelhouse/*.whl)
        [ ${#wheels[@]} -gt 0 ] || { echo "::error::no wheel built"; exit 1; }
        rc=0
        for whl in "${wheels[@]}"; do
          name="$(basename "$whl")"
          # manylinux_<major>_<minor>: require <= 2_28, the image we build in.
          if [[ "$name" =~ manylinux_([0-9]+)_([0-9]+)_ ]]; then
            major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"
            if [ "$major" -gt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -gt 28 ]; }; then
              echo "::error::$name exceeds the manylinux_2_28 floor -- the LLVM prefix"\
                   "imports too-recent GLIBCXX/CXXABI symbols."
              rc=1
            else
              echo "OK: $name is within the manylinux_2_28 floor"
            fi
          else
            echo "::error::$name carries no manylinux platform tag"; rc=1
          fi
        done
        # Report the C++ ABI symbol versions the .so actually imports, so the log
        # documents the floor instead of only asserting it.
        tmp="$(mktemp -d)"
        # python rather than unzip: it is guaranteed present on the runner, and a
        # missing tool here would abort the step and hide the result above.
        python3 -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
          "${wheels[0]}" "$tmp"
        for so in $(find "$tmp" -name '*orcjit*.so'); do
          echo "--- $(basename "$so") ---"
          syms="$(readelf --dyn-syms --wide "$so")"
          for prefix in GLIBCXX CXXABI; do
            echo "  max ${prefix} imported: $(printf '%s\n' "$syms" \
              | grep -oE "${prefix}_[0-9.]+" | sort -uV | tail -1)"
          done
          echo "  C++ runtime refs (expect UND -> served by the process libstdc++):"
          printf '%s\n' "$syms" \
            | grep -E ' UND +(_Znwm|__cxa_throw|__gxx_personality_v0)\b' \
            | awk '{print "    " $8}' | sort -u
          echo "  defined dynamic exports: $(printf '%s\n' "$syms" \
            | awk '$4~/FUNC|OBJECT/ && $5~/GLOBAL|WEAK/ && $7!="UND"' | wc -l)"
        done
        rm -rf "$tmp"
        exit $rc
